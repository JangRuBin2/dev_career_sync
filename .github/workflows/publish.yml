name: velog publish (disabled)

# ⏸ 자동 발행은 현재 사용하지 않아요 (초안 작성까지만 자동화, 발행은 직접).
# 다시 쓰려면: 아래 schedule 주석을 풀고 Variables 에 AUTO_PUBLISH=1, Secrets 에 VELOG 토큰을 등록하세요.
on:
  # schedule:
  #   - cron: "7 * * * *"
  workflow_dispatch:

concurrency: careersync-notion

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DS_WORK_LOG: ${{ secrets.NOTION_DS_WORK_LOG }}
      NOTION_DS_PROJECTS: ${{ secrets.NOTION_DS_PROJECTS }}
      NOTION_DS_RECORDS: ${{ secrets.NOTION_DS_RECORDS }}
      NOTION_DS_METRICS: ${{ secrets.NOTION_DS_METRICS }}
      NOTION_DS_ACHIEVEMENTS: ${{ secrets.NOTION_DS_ACHIEVEMENTS }}
      NOTION_DS_POSTS: ${{ secrets.NOTION_DS_POSTS }}
      NOTION_DS_ATTACHMENTS: ${{ secrets.NOTION_DS_ATTACHMENTS }}
      NOTION_RESUME_PAGE_ID: ${{ secrets.NOTION_RESUME_PAGE_ID }}
      DENYLIST: ${{ secrets.DENYLIST }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      VELOG_ACCESS_TOKEN: ${{ secrets.VELOG_ACCESS_TOKEN }}
      VELOG_REFRESH_TOKEN: ${{ secrets.VELOG_REFRESH_TOKEN }}
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH }}
      PUBLIC_IMAGE_HOSTS: ${{ vars.PUBLIC_IMAGE_HOSTS || 'public.blob.vercel-storage.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm job:publish
