name: Weekly digest

# 매주 금요일 18:00 KST (= 09:00 UTC). 수동 실행 시 dry-run 선택 가능
on:
  schedule:
    - cron: "0 9 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Notion 에 쓰지 않고 결과만 출력"
        type: boolean
        default: false

concurrency: careersync-notion

permissions:
  contents: read
  id-token: write # Workload Identity Federation 용 GitHub OIDC 토큰 발급

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DS_WORK_LOG: ${{ secrets.NOTION_DS_WORK_LOG }}
      NOTION_DS_PROJECTS: ${{ secrets.NOTION_DS_PROJECTS }}
      NOTION_DS_RECORDS: ${{ secrets.NOTION_DS_RECORDS }}
      NOTION_DS_METRICS: ${{ secrets.NOTION_DS_METRICS }}
      NOTION_DS_ACHIEVEMENTS: ${{ secrets.NOTION_DS_ACHIEVEMENTS }}
      NOTION_DS_POSTS: ${{ secrets.NOTION_DS_POSTS }}
      NOTION_DS_ATTACHMENTS: ${{ secrets.NOTION_DS_ATTACHMENTS }}
      NOTION_RESUME_PAGE_ID: ${{ secrets.NOTION_RESUME_PAGE_ID }}
      DENYLIST: ${{ secrets.DENYLIST }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # Claude 인증: Variables 에 ANTHROPIC_FEDERATION_RULE_ID 가 있으면 Workload Identity Federation
      # (실행마다 GitHub OIDC 토큰으로 단기 토큰 발급, SDK 가 자동 갱신 → 키 만료 걱정 없음), 없으면 API 키 사용
      ANTHROPIC_API_KEY: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID == '' && secrets.ANTHROPIC_API_KEY || '' }}
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID != '' && '/tmp/anthropic-oidc.jwt' || '' }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Claude 인증 토큰 발급 (Workload Identity Federation)
        if: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID != '' }}
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          test -s "$ANTHROPIC_IDENTITY_TOKEN_FILE"
      - run: pnpm job:weekly
