name: velog draft

# 매일 확인하고, POST_INTERVAL_DAYS 주기가 됐을 때만 초안을 만든다 (10:17 KST)
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

concurrency: careersync-notion

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DS_WORK_LOG: ${{ secrets.NOTION_DS_WORK_LOG }}
      NOTION_DS_PROJECTS: ${{ secrets.NOTION_DS_PROJECTS }}
      NOTION_DS_RECORDS: ${{ secrets.NOTION_DS_RECORDS }}
      NOTION_DS_METRICS: ${{ secrets.NOTION_DS_METRICS }}
      NOTION_DS_ACHIEVEMENTS: ${{ secrets.NOTION_DS_ACHIEVEMENTS }}
      NOTION_DS_POSTS: ${{ secrets.NOTION_DS_POSTS }}
      NOTION_DS_ATTACHMENTS: ${{ secrets.NOTION_DS_ATTACHMENTS }}
      NOTION_RESUME_PAGE_ID: ${{ secrets.NOTION_RESUME_PAGE_ID }}
      DENYLIST: ${{ secrets.DENYLIST }}
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      POST_INTERVAL_DAYS: ${{ vars.POST_INTERVAL_DAYS || '14' }}
      POST_LEAD_DAYS: ${{ vars.POST_LEAD_DAYS || '3' }}
      POST_DEFAULT_MODE: ${{ vars.POST_DEFAULT_MODE || '임시저장' }}
      POST_PUBLISH_HOUR_KST: ${{ vars.POST_PUBLISH_HOUR_KST || '9' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @careersync/jobs draft-posts
